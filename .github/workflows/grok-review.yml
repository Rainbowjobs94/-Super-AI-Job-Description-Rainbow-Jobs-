name: grok-review
on: pull_request
jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify XAI_API_KEY secret is set
        run: |
          if [ -z "$XAI_API_KEY" ]; then
            echo "::error::XAI_API_KEY repository secret is missing. Add it under Settings → Secrets and variables → Actions (key from https://console.x.ai)."
            exit 1
          fi
          echo "XAI_API_KEY is present (length ${#XAI_API_KEY})."
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      - name: Install Grok CLI
        run: curl -fsSL https://x.ai/cli/install.sh | bash
        timeout-minutes: 5
      - run: echo "$HOME/.grok/bin" >> $GITHUB_PATH
      - name: Run Grok review
        run: grok -p "Review this PR for bugs" --always-approve
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 10
