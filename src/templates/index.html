<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Operator Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        .chat-box {
            height: 300px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 10px;
            background-color: #fafafa;
        }
        .message {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 4px;
        }
        .user-message {
            background-color: #e3f2fd;
            text-align: right;
        }
        .ai-message {
            background-color: #f5f5f5;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .upload-section {
            border-top: 1px solid #ccc;
            padding-top: 20px;
        }
        #upload-status {
            margin-top: 10px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Operator Hub</h1>

        <h2>Chat</h2>
        <div class="chat-box" id="chat-box"></div>
        <div class="input-group">
            <input type="text" id="chat-input" placeholder="Type your message here..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>

        <div class="upload-section">
            <h2>Upload File</h2>
            <div class="input-group">
                <input type="file" id="file-input">
                <button onclick="uploadFile()">Upload</button>
            </div>
            <div id="upload-status"></div>
        </div>
    </div>

    <script>
        function appendMessage(text, isUser) {
            const chatBox = document.getElementById('chat-box');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            messageDiv.textContent = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();

            if (!message) return;

            appendMessage(message, true);
            input.value = '';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                if (response.ok) {
                    appendMessage(data.response, false);
                } else {
                    appendMessage(`Error: ${data.error}`, false);
                }
            } catch (error) {
                appendMessage(`Error: Could not connect to server.`, false);
            }
        }

        async function uploadFile() {
            const fileInput = document.getElementById('file-input');
            const statusDiv = document.getElementById('upload-status');
            const file = fileInput.files[0];

            if (!file) {
                statusDiv.textContent = 'Please select a file first.';
                statusDiv.style.color = 'red';
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            statusDiv.textContent = 'Uploading...';
            statusDiv.style.color = 'black';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (response.ok) {
                    statusDiv.textContent = `Success: ${data.message}`;
                    statusDiv.style.color = 'green';
                    fileInput.value = ''; // Clear input
                } else {
                    statusDiv.textContent = `Error: ${data.error}`;
                    statusDiv.style.color = 'red';
                }
            } catch (error) {
                statusDiv.textContent = 'Error: Could not connect to server.';
                statusDiv.style.color = 'red';
            }
        }
    </script>
</body>
</html>
