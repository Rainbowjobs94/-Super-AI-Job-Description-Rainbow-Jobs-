<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Operator Hub - Physical-23</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .chat-box {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            background-color: #fafafa;
        }
        .message {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 4px;
        }
        .user-message {
            background-color: #d1e7dd;
            text-align: right;
        }
        .bot-message {
            background-color: #f8d7da;
            text-align: left;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"], input[type="file"] {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .file-list {
            margin-top: 20px;
            list-style-type: none;
            padding: 0;
        }
        .file-list li {
            background: #e9ecef;
            margin: 5px 0;
            padding: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
        }
        .file-list a {
            text-decoration: none;
            color: #007bff;
        }
    </style>
</head>
<body>

    <h1>AI Operator Hub - Physical-23</h1>

    <div class="container">
        <h2>Chat Interface</h2>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-group">
            <input type="text" id="chatInput" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <div class="container">
        <h2>File Management</h2>
        <div class="input-group">
            <input type="file" id="fileInput">
            <button onclick="uploadFile()">Upload File</button>
        </div>
        <h3>Uploaded Files</h3>
        <ul class="file-list" id="fileList"></ul>
    </div>

    <script>
        function appendMessage(text, className) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + className;
            messageDiv.textContent = text; // Safe DOM manipulation
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;

            appendMessage("You: " + message, 'user-message');
            input.value = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();
                if (data.response) {
                    appendMessage("Physical-23: " + data.response, 'bot-message');
                } else if (data.error) {
                    appendMessage("Error: " + data.error, 'bot-message');
                }
            } catch (error) {
                appendMessage("Error connecting to server.", 'bot-message');
            }
        }

        document.getElementById('chatInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) {
                alert("Please select a file to upload.");
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (data.message) {
                    alert("Upload successful!");
                    fileInput.value = ''; // Clear input
                    fetchFiles(); // Refresh list
                } else if (data.error) {
                    alert("Upload failed: " + data.error);
                }
            } catch (error) {
                alert("Error connecting to server.");
            }
        }

        async function fetchFiles() {
            try {
                const response = await fetch('/api/files');
                const data = await response.json();
                const fileList = document.getElementById('fileList');
                fileList.innerHTML = ''; // Clear existing list to reload safely

                if (data.files && data.files.length > 0) {
                    data.files.forEach(file => {
                        const li = document.createElement('li');

                        const a = document.createElement('a');
                        a.href = file.url;
                        a.target = '_blank';
                        a.textContent = file.name; // Safe DOM manipulation

                        const sizeSpan = document.createElement('span');
                        sizeSpan.textContent = (file.size / 1024).toFixed(2) + ' KB';

                        li.appendChild(a);
                        li.appendChild(sizeSpan);
                        fileList.appendChild(li);
                    });
                } else {
                    const li = document.createElement('li');
                    li.textContent = "No files uploaded yet.";
                    fileList.appendChild(li);
                }
            } catch (error) {
                console.error("Error fetching files:", error);
            }
        }

        // Load files on startup
        fetchFiles();
    </script>

</body>
</html>
